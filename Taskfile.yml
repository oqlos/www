version: '1'
name: oqlos-portal
description: Minimal Taskfile
variables:
  APP_NAME: oqlos-portal
environments:
  local:
    container_runtime: docker
    compose_command: docker compose
tasks:
  install:
    desc: Install npm dependencies
    cmds:
    - npm install
  build:
    desc: 'Run npm script: build'
    cmds:
    - npm run build
  test:
    desc: 'Run npm script: test'
    cmds:
    - npm run test
  lint:
    desc: 'Run npm script: lint'
    cmds:
    - npm run lint
  dev:
    desc: 'Run npm script: dev'
    cmds:
    - npm run dev
  docker-build:
    desc: Build docker image
    cmds:
    - docker build -t oqlos-portal:latest .
  help:
    desc: '[imported from Makefile] help'
    cmds:
    - echo "OqlOS Portal - Available commands:"
    - echo "  make dev          - Start development server (npm)"
    - echo "  make dev-docker   - Start development server (Docker)"
    - echo "  make dev-open     - Start dev containers and open browser"
    - echo "  make build        - Build for production (npm)"
    - echo "  make preview      - Preview production build"
    - echo "  make install      - Install dependencies"
    - echo "  make test         - Run full test suite (shell)"
    - echo "  make test-e2e     - Run Playwright E2E tests"
    - echo "  make test-unit    - Run unit tests (placeholder)"
    - echo "  make test-ui      - Run E2E tests with UI"
    - echo "  make lint         - Run linter"
    - echo "  make ansible-test - Run Ansible E2E tests"
    - echo "  make ansible-deploy - Deploy with Ansible"
    - echo "  make analyze      - Run code analysis (project.sh)"
    - echo "  make clean        - Clean build artifacts"
    - echo "  make clean-all    - Clean everything including node_modules"
    - echo "  make docker-build - Build Docker image"
    - echo "  make dev-docker   - Start dev stack (Traefik + API + Portal)"
    - echo "  make prod  - Start prod stack (HTTPS + Let's Encrypt)"
  preview:
    desc: '[imported from Makefile] preview'
    cmds:
    - npm run preview
  test-e2e:
    desc: '[imported from Makefile] test-e2e'
    cmds:
    - npx playwright test
  test-e2e-ci:
    desc: '[imported from Makefile] test-e2e-ci'
    cmds:
    - npx playwright test --project=chromium --reporter=line
  test-unit:
    desc: '[imported from Makefile] test-unit'
    cmds:
    - npm run test:unit
  test-ui:
    desc: '[imported from Makefile] test-ui'
    cmds:
    - npm run test:e2e:ui
  security-audit:
    desc: '[imported from Makefile] security-audit'
    cmds:
    - npm audit --audit-level moderate
  deploy:
    desc: '[imported from Makefile] deploy'
    cmds:
    - ansible-playbook -i ansible/inventory.ini ansible/playbook-deploy.yml
  ansible-test:
    desc: '[imported from Makefile] ansible-test'
    cmds:
    - ansible-playbook -i ansible/inventory.ini ansible/playbook-test.yml
  ansible-deploy:
    desc: '[imported from Makefile] ansible-deploy'
    cmds:
    - ansible-playbook -i ansible/inventory.ini ansible/playbook-deploy.yml
  analyze:
    desc: '[imported from Makefile] analyze'
    cmds:
    - bash project.sh
  clean:
    desc: '[imported from Makefile] clean'
    cmds:
    - rm -rf dist/
    - rm -rf test-results/
    - rm -rf playwright-report/
    - rm -rf project/
  clean-all:
    desc: '[imported from Makefile] clean-all'
    cmds:
    - rm -rf node_modules/
    - rm -rf venv/
    deps:
    - clean
  ci:
    desc: '[imported from Makefile] ci'
    deps:
    - install
    - lint
    - build
    - test-e2e-ci
    - security-audit
  docker-run:
    desc: '[imported from Makefile] docker-run'
    cmds:
    - docker run -p 80:80 -e NGINX_PORT=80 -e BACKEND_URL=http://host.docker.internal:8101
      oqlos-portal:latest
  dev-docker:
    desc: '[imported from Makefile] dev-docker'
    cmds:
    - echo "Restarting dev Docker stack..."
    - docker compose -f infra/docker/dev/docker-compose.dev.yml down
    - docker compose -f infra/docker/dev/docker-compose.dev.yml up -d --build
    - echo "Dev Docker stack restarted"
  dev-docker-down:
    desc: '[imported from Makefile] dev-docker-down'
    cmds:
    - docker compose -f infra/docker/dev/docker-compose.dev.yml down
  dev-open:
    desc: '[imported from Makefile] dev-open'
    cmds:
    - "echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\""
    - echo "  OqlOS Portal - Development Environment"
    - "echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\""
    - echo ""
    - echo "Starting Docker containers..."
    - docker compose -f infra/docker/dev/docker-compose.dev.yml up -d --build
    - echo ""
    - echo "Checking /etc/hosts..."
    - "grep -q \"oqlos.localhost\" /etc/hosts && echo \"\u2713 Domains already configured\"\
      \ || echo \"\u26A0 Run: echo '127.0.0.1 oqlos.localhost traefik.oqlos.localhost\
      \ mail.oqlos.localhost' | sudo tee -a /etc/hosts\""
    - echo ""
    - "echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\""
    - echo "  Services available at:"
    - "echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\""
    - "echo \"  \U0001F310 Portal:        http://oqlos.localhost\""
    - "echo \"  \U0001F4CA Traefik:       http://traefik.oqlos.localhost\""
    - "echo \"  \U0001F4E7 Mailpit:       http://mail.oqlos.localhost\""
    - "echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\""
    - echo ""
    - 'echo "Open in browser: http://oqlos.localhost"'
    - echo ""
    - 'echo "To stop containers, run: make dev-docker-down"'
    - "echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
      \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\""
  prod:
    desc: '[imported from Makefile] prod'
    cmds:
    - docker compose -f infra/docker/prod/docker-compose.prod.yml up -d
  prod-down:
    desc: '[imported from Makefile] prod-down'
    cmds:
    - docker compose -f infra/docker/prod/docker-compose.prod.yml down
  playwright-install:
    desc: '[imported from Makefile] playwright-install'
    cmds:
    - npx playwright install chromium firefox webkit
  playwright-deps:
    desc: '[imported from Makefile] playwright-deps'
    cmds:
    - sudo npx playwright install-deps
  commit:
    desc: '[imported from Makefile] commit'
    cmds:
    - git add .
    - git commit -m "$(m)"
  tag:
    desc: '[imported from Makefile] tag'
    cmds:
    - git tag v$(v)
    - git push origin v$(v)
  all:
    desc: Run install, lint, test
    cmds:
    - taskfile run install
    - taskfile run lint
    - taskfile run test
  fmt:
    desc: Auto-format with ruff
    cmds:
    - ruff format .
