version: "3.9"

services:
  # ── Traefik Reverse Proxy ──
  traefik:
    image: traefik:v3.2
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - oqlos-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.oqlos.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  # ── OqlOS API (FastAPI) ──
  oqlapi:
    build:
      context: ../../../packages/oql-api
      dockerfile: Dockerfile
    environment:
      - OQLOS_ENV=dev
      - OQLOS_HARDWARE_MODE=mock
      - DB_PATH=/data/oqlos.db
      - CORS_ORIGINS=http://oqlos.localhost,http://ide.oqlos.localhost
    volumes:
      - api-data:/data
      - ../../../scenarios:/scenarios:ro
    networks:
      - oqlos-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.oqlos.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8101"

  # ── WWW Portal (React/Vite) ──
  portal:
    build:
      context: ../../../
      dockerfile: Dockerfile
    environment:
      - NGINX_PORT=80
      - BACKEND_URL=http://oqlapi:8101
    depends_on:
      - oqlapi
    networks:
      - oqlos-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal.rule=Host(`oqlos.localhost`)"
      - "traefik.http.routers.portal.entrypoints=web"
      - "traefik.http.services.portal.loadbalancer.server.port=80"

  # ── Mailpit (dev SMTP) ──
  mailpit:
    image: axllent/mailpit:latest
    networks:
      - oqlos-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mail.rule=Host(`mail.oqlos.localhost`)"
      - "traefik.http.services.mail.loadbalancer.server.port=8025"

volumes:
  api-data:

networks:
  oqlos-net:
    driver: bridge
