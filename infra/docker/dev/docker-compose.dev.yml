services:
  # ── Traefik Reverse Proxy ──
  traefik:
    image: traefik:v3.6.2
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - oqlos-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${DOCKER_DOMAIN_TRAEFIK}`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  # ── WWW Portal (React/Vite) ──
  portal:
    build:
      context: ../../../
      dockerfile: Dockerfile
      args:
        VITE_FORCE_MOCK_API: "true"
    ports:
      - "8090:80"
    environment:
      - NGINX_PORT=80
    networks:
      - oqlos-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal.rule=Host(`${DOCKER_DOMAIN_PORTAL}`)"
      - "traefik.http.routers.portal.entrypoints=web"
      - "traefik.http.services.portal.loadbalancer.server.port=80"

  # ── CQL Editor Service ──
  cql:
    build:
      context: ../../../../cql/
      dockerfile: Dockerfile
    ports:
      - "8091:80"
    networks:
      - oqlos-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cql.rule=Host(`${DOCKER_DOMAIN_CQL}`)"
      - "traefik.http.routers.cql.entrypoints=web"
      - "traefik.http.services.cql.loadbalancer.server.port=80"

  # ── Mailpit (dev SMTP) ──
  mailpit:
    image: axllent/mailpit:latest
    networks:
      - oqlos-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mail.rule=Host(`${DOCKER_DOMAIN_MAILPIT}`)"
      - "traefik.http.services.mail.loadbalancer.server.port=8025"

networks:
  oqlos-net:
    driver: bridge
