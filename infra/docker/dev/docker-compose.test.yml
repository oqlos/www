services:
  # ── Test Data Service ──
  test-data:
    image: postgres:16-alpine
    container_name: oqlos-test-data
    environment:
      POSTGRES_DB: oqlos_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    volumes:
      - ./init-test-data.sql:/docker-entrypoint-initdb.d/init-test-data.sql
      - test-data:/var/lib/postgresql/data
    networks:
      - oqlos-net
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d oqlos_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis for test sessions ──
  test-redis:
    image: redis:7-alpine
    container_name: oqlos-test-redis
    command: redis-server --requirepass test_redis_password
    networks:
      - oqlos-net
    ports:
      - "6380:6379"

volumes:
  test-data:

networks:
  oqlos-net:
    driver: bridge
