version: "3.9"

services:
  traefik:
    image: traefik:v3.2
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # HTTP → HTTPS redirect
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--log.level=WARN"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - oqlos-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oqlos
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - oqlos-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASS}
    networks:
      - oqlos-net
    restart: unless-stopped

  oqlapi:
    image: ghcr.io/softreck/oqlapi:${VERSION:-latest}
    environment:
      - OQLOS_ENV=prod
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@postgres/oqlos
      - REDIS_URL=redis://:${REDIS_PASS}@redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SK}
      - PRZELEWY24_MERCHANT_ID=${P24_MID}
      - PRZELEWY24_CRC=${P24_CRC}
      - SMTP_HOST=${SMTP_HOST:-postfix}
      - SMTP_PORT=${SMTP_PORT:-587}
      - CORS_ORIGINS=https://oqlos.com,https://www.oqlos.com,https://ide.oqlos.com
    depends_on: [postgres, redis]
    networks:
      - oqlos-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.oqlos.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.services.api.loadbalancer.server.port=8101"

  portal:
    image: ghcr.io/softreck/oqlos-portal:${VERSION:-latest}
    environment:
      - NGINX_PORT=80
      - BACKEND_URL=http://oqlapi:8101
    depends_on: [oqlapi]
    networks:
      - oqlos-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # oqlos.com + www.oqlos.com
      - "traefik.http.routers.portal.rule=Host(`oqlos.com`) || Host(`www.oqlos.com`)"
      - "traefik.http.routers.portal.entrypoints=websecure"
      - "traefik.http.routers.portal.tls.certresolver=le"
      - "traefik.http.services.portal.loadbalancer.server.port=80"
      # www → apex redirect
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.oqlos\\.com/(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://oqlos.com/$${1}"
      - "traefik.http.routers.portal.middlewares=www-redirect"

volumes:
  pgdata:
  letsencrypt:

networks:
  oqlos-net:
    driver: bridge
